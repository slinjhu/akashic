<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">A batch groups chunks from a longer Shakespeare passage</title><desc id="desc">A passage from Richard III has three four-token chunks boxed. The first two overlap. Matching colors connect the selected text with each batch row.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="450" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#0f172a">
<text x="450" y="36" font-size="23" text-anchor="middle" font-weight="700">A batch groups several text chunks</text>
<text x="90" y="75" font-size="17" text-anchor="start" font-weight="600">Tokenized passage · Richard III, Act 5, Scene 3</text>
<rect x="334.6" y="98" width="178.8" height="38" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="442.6" y="102" width="168.0" height="30" rx="6" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="100" y="126" font-size="18" text-anchor="start" font-family="monospace" xml:space="preserve">Up with my tent there! here will I lie tonight; But where to-morrow?</text>
<rect x="572.2" y="150" width="200.4" height="30" rx="6" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="100" y="174" font-size="18" text-anchor="start" font-family="monospace" xml:space="preserve"> Well, all&#x27;s one for that. Who hath descried the number of the foe?</text>
<text x="450" y="216" font-size="17" text-anchor="middle" >Select starting token positions; take 4 consecutive tokens from each</text>
<rect x="155" y="238" width="675" height="200" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="492" y="268" font-size="19" text-anchor="middle" font-weight="600">Illustration: batch size 3, chunk size 4</text>
<text x="135" y="310" font-size="16" text-anchor="end" fill="#475569">Chunk 1</text>
<rect x="180" y="284" width="625" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="492" y="309" font-size="20" text-anchor="middle" font-family="monospace" xml:space="preserve"> here will I lie</text>
<text x="135" y="358" font-size="16" text-anchor="end" fill="#475569">Chunk 2</text>
<rect x="180" y="332" width="625" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="492" y="357" font-size="20" text-anchor="middle" font-family="monospace" xml:space="preserve"> I lie tonight;</text>
<text x="135" y="406" font-size="16" text-anchor="end" fill="#475569">Chunk 3</text>
<rect x="180" y="380" width="625" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="492" y="405" font-size="20" text-anchor="middle" font-family="monospace" xml:space="preserve"> the number of the</text>
</g></svg>
