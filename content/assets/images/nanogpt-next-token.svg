<svg xmlns="http://www.w3.org/2000/svg" width="840" height="488" viewBox="0 0 840 488" role="img" aria-labelledby="title desc">
<title id="title">One sentence supplies five next-token training questions</title><desc id="desc">GPT-2 tokenizes Here will I lie tonight. into six tokens. Each prefix predicts the next token; underscores show spaces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="840" height="488" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#0f172a">
<text x="420" y="38" font-size="23" text-anchor="middle" font-weight="700">One sentence → five training questions</text>
<text x="420" y="78" font-size="20" text-anchor="middle" font-family="monospace">Here | _will | _I | _lie | _tonight | .</text>
<text x="420" y="108" font-size="15" text-anchor="middle" fill="#475569">Each piece between separators is one token; _ denotes a space.</text>
<text x="50" y="152" font-size="18" text-anchor="start" font-weight="600">Text available to the model</text>
<text x="640" y="152" font-size="18" text-anchor="start" font-weight="600">Target</text>
<rect x="50" y="172" width="470" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<rect x="630" y="172" width="150" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="68" y="198" font-size="21" text-anchor="start" font-family="monospace">Here</text>
<text x="705" y="198" font-size="21" text-anchor="middle" font-family="monospace">_will</text>
<path d="M535 192 H613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="224" width="470" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<rect x="630" y="224" width="150" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="68" y="250" font-size="21" text-anchor="start" font-family="monospace">Here_will</text>
<text x="705" y="250" font-size="21" text-anchor="middle" font-family="monospace">_I</text>
<path d="M535 244 H613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="276" width="470" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<rect x="630" y="276" width="150" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="68" y="302" font-size="21" text-anchor="start" font-family="monospace">Here_will_I</text>
<text x="705" y="302" font-size="21" text-anchor="middle" font-family="monospace">_lie</text>
<path d="M535 296 H613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="328" width="470" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<rect x="630" y="328" width="150" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="68" y="354" font-size="21" text-anchor="start" font-family="monospace">Here_will_I_lie</text>
<text x="705" y="354" font-size="21" text-anchor="middle" font-family="monospace">_tonight</text>
<path d="M535 348 H613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="380" width="470" height="40" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<rect x="630" y="380" width="150" height="40" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
<text x="68" y="406" font-size="21" text-anchor="start" font-family="monospace">Here_will_I_lie_tonight</text>
<text x="705" y="406" font-size="21" text-anchor="middle" font-family="monospace">.</text>
<path d="M535 400 H613" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="420" y="468" font-size="16" text-anchor="middle" fill="#475569">The original text supplies the correct next token at each position.</text>
</g></svg>
