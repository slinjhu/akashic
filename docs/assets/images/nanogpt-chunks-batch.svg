<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">A batch groups several token chunks</title><desc id="desc">Three overlapping four-token chunks are selected from Here will I lie tonight. Each chunk becomes one row of the batch. Underscores denote spaces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="900" height="480" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" fill="#0f172a">
<text x="450" y="36" font-size="23" text-anchor="middle" font-weight="700">A batch groups several text chunks</text>
<text x="120" y="73" font-size="17" text-anchor="start" font-weight="600">Tokenized text</text>
<rect x="120" y="86" width="430" height="78" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/>
<rect x="230" y="92" width="430" height="66" rx="6" fill="none" stroke="#7c3aed" stroke-width="2"/>
<rect x="340" y="98" width="430" height="54" rx="6" fill="none" stroke="#16a34a" stroke-width="2"/>
<text x="170" y="132" font-size="19" text-anchor="middle" font-family="monospace">Here</text>
<text x="280" y="132" font-size="19" text-anchor="middle" font-family="monospace">_will</text>
<text x="390" y="132" font-size="19" text-anchor="middle" font-family="monospace">_I</text>
<text x="500" y="132" font-size="19" text-anchor="middle" font-family="monospace">_lie</text>
<text x="610" y="132" font-size="19" text-anchor="middle" font-family="monospace">_tonight</text>
<text x="720" y="132" font-size="19" text-anchor="middle" font-family="monospace">.</text>
<text x="450" y="199" font-size="17" text-anchor="middle" >Select starting token positions; take 4 consecutive tokens from each</text>
<rect x="155" y="223" width="675" height="200" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="492" y="253" font-size="19" text-anchor="middle" font-weight="600">Illustration: batch size 3, chunk size 4</text>
<text x="135" y="295" font-size="16" text-anchor="end" fill="#475569">Chunk 1</text>
<rect x="180" y="269" width="625" height="38" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="258" y="294" font-size="20" text-anchor="middle" font-family="monospace">Here</text>
<text x="414" y="294" font-size="20" text-anchor="middle" font-family="monospace">_will</text>
<text x="570" y="294" font-size="20" text-anchor="middle" font-family="monospace">_I</text>
<text x="726" y="294" font-size="20" text-anchor="middle" font-family="monospace">_lie</text>
<text x="135" y="343" font-size="16" text-anchor="end" fill="#475569">Chunk 2</text>
<rect x="180" y="317" width="625" height="38" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="258" y="342" font-size="20" text-anchor="middle" font-family="monospace">_will</text>
<text x="414" y="342" font-size="20" text-anchor="middle" font-family="monospace">_I</text>
<text x="570" y="342" font-size="20" text-anchor="middle" font-family="monospace">_lie</text>
<text x="726" y="342" font-size="20" text-anchor="middle" font-family="monospace">_tonight</text>
<text x="135" y="391" font-size="16" text-anchor="end" fill="#475569">Chunk 3</text>
<rect x="180" y="365" width="625" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="258" y="390" font-size="20" text-anchor="middle" font-family="monospace">_I</text>
<text x="414" y="390" font-size="20" text-anchor="middle" font-family="monospace">_lie</text>
<text x="570" y="390" font-size="20" text-anchor="middle" font-family="monospace">_tonight</text>
<text x="726" y="390" font-size="20" text-anchor="middle" font-family="monospace">.</text>
<text x="450" y="455" font-size="15" text-anchor="middle" fill="#475569">_ denotes a space.</text>
</g></svg>
