<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc">
  <title id="title">Q and K choose the weights; V supplies the information</title>
  <desc id="desc">The normalized input tensor, shape 1 by 4 by 128, is transformed into queries, keys, and values, each split into four heads of shape 1 by 4 by 4 by 32. Q times transposed K produces scores. Scaling, a causal mask, and softmax produce attention weights of shape 1 by 4 by 4 by 4. Those weights multiply V to produce shape 1 by 4 by 4 by 32. Joining heads and applying an output projection returns shape 1 by 4 by 128. One illustrative query at lie mixes the values for Here, will, I, and lie with weights 0.1, 0.2, 0.1, and 0.6.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="790" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="480" y="36" font-size="23" font-weight="700">Q and K choose the weights; V supplies the information</text>
    <rect x="250" y="62" width="460" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="480" y="94" font-size="18">Normalized input · [1, 4, 128]</text>
    <text x="480" y="148" font-size="16" fill="#475569">Learned linear transformations, then split into 4 heads</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M480 114 V125 H170 V172"/>
      <path d="M480 156 V172"/>
      <path d="M480 125 H790 V172"/>
      <path d="M170 260 V288 H280 V312"/>
      <path d="M480 260 V288 H360 V312"/>
      <path d="M320 394 V402 M320 430 V441"/>
      <path d="M320 501 V546"/>
      <path d="M790 260 V575 H550"/>
      <path d="M320 604 V641"/>
    </g>
    <rect x="40" y="174" width="260" height="86" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="350" y="174" width="260" height="86" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
    <rect x="660" y="174" width="260" height="86" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="170" y="202" font-size="20" font-weight="700">Q · Queries</text>
    <text x="170" y="226" font-size="16">What to match</text>
    <text x="170" y="249" font-size="16">[1, 4, 4, 32]</text>
    <text x="480" y="202" font-size="20" font-weight="700">K · Keys</text>
    <text x="480" y="226" font-size="16">What each position offers to match</text>
    <text x="480" y="249" font-size="16">[1, 4, 4, 32]</text>
    <text x="790" y="202" font-size="20" font-weight="700">V · Values</text>
    <text x="790" y="226" font-size="16">Information to mix</text>
    <text x="790" y="249" font-size="16">[1, 4, 4, 32]</text>
    <rect x="90" y="314" width="460" height="80" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="320" y="342" font-size="18" font-weight="600">Compare Q with K: Q × Kᵀ</text>
    <text x="320" y="367" font-size="16">One score per query–key pair</text>
    <text x="320" y="388" font-size="15">Scores · [1, 4, 4, 4]</text>
    <text x="320" y="424" font-size="16" fill="#475569">Divide by √32 → mask future positions → softmax</text>
    <rect x="90" y="443" width="460" height="58" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="320" y="468" font-size="18" font-weight="600">Attention weights</text>
    <text x="320" y="490" font-size="16">[1, 4, 4, 4]</text>
    <rect x="90" y="548" width="460" height="56" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="320" y="572" font-size="18" font-weight="600">Weighted sum of V</text>
    <text x="320" y="594" font-size="16">[1, 4, 4, 32]</text>
    <rect x="90" y="643" width="460" height="57" rx="8" fill="#dcfce7" stroke="#4ade80"/>
    <text x="320" y="668" font-size="18" font-weight="600">Join heads → output projection</text>
    <text x="320" y="691" font-size="16">Attention output · [1, 4, 128]</text>
    <text x="480" y="741" font-size="17">For one head at “lie”: 0.1 V(Here) + 0.2 V(will) + 0.1 V(I) + 0.6 V(lie)</text>
    <text x="480" y="768" font-size="15" fill="#475569">Illustrative weights. Each query can only use its current and earlier positions.</text>
  </g>
</svg>
