<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">One passage supplies six training questions</title>
  <desc id="desc">For the text ROMEO: followed by a newline, each prefix is an input and the next character is its target: R predicts O, RO predicts M, ROM predicts E, ROME predicts O, ROMEO predicts a colon, and ROMEO: predicts a newline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="720" height="540" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#0f172a">
    <text x="360" y="38" text-anchor="middle" font-size="23" font-weight="700">One passage → six training questions</text>
    <text x="360" y="76" text-anchor="middle" font-family="monospace" font-size="24">ROMEO:\n</text>
    <text x="360" y="104" text-anchor="middle" font-size="15" fill="#475569">\n denotes a newline</text>
    <text x="120" y="151" font-size="18" font-weight="600">Text available to the model</text>
    <text x="472" y="151" font-size="18" font-weight="600">Target</text>
    <g fill="#dbeafe" stroke="#60a5fa">
      <rect x="120" y="170" width="240" height="42" rx="6"/>
      <rect x="120" y="224" width="240" height="42" rx="6"/>
      <rect x="120" y="278" width="240" height="42" rx="6"/>
      <rect x="120" y="332" width="240" height="42" rx="6"/>
      <rect x="120" y="386" width="240" height="42" rx="6"/>
      <rect x="120" y="440" width="240" height="42" rx="6"/>
    </g>
    <g fill="#dcfce7" stroke="#4ade80">
      <rect x="472" y="170" width="100" height="42" rx="6"/>
      <rect x="472" y="224" width="100" height="42" rx="6"/>
      <rect x="472" y="278" width="100" height="42" rx="6"/>
      <rect x="472" y="332" width="100" height="42" rx="6"/>
      <rect x="472" y="386" width="100" height="42" rx="6"/>
      <rect x="472" y="440" width="100" height="42" rx="6"/>
    </g>
    <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M376 191 H456"/>
      <path d="M376 245 H456"/>
      <path d="M376 299 H456"/>
      <path d="M376 353 H456"/>
      <path d="M376 407 H456"/>
      <path d="M376 461 H456"/>
    </g>
    <g font-family="monospace" font-size="23">
      <text x="140" y="199">R</text>
      <text x="140" y="253">RO</text>
      <text x="140" y="307">ROM</text>
      <text x="140" y="361">ROME</text>
      <text x="140" y="415">ROMEO</text>
      <text x="140" y="469">ROMEO:</text>
      <g text-anchor="middle">
        <text x="522" y="199">O</text>
        <text x="522" y="253">M</text>
        <text x="522" y="307">E</text>
        <text x="522" y="361">O</text>
        <text x="522" y="415">:</text>
        <text x="522" y="469">\n</text>
      </g>
    </g>
    <text x="360" y="518" text-anchor="middle" font-size="16" fill="#475569">Each answer comes from the next character in the original text.</text>
  </g>
</svg>
