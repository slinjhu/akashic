<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc">
<title id="title">nanoGPT architecture and its 7,228,672 learned parameters</title>
<desc id="desc">Token embeddings contain 6,432,896 parameters and positional embeddings contain 8,192. Add their vectors, then pass through four sequential Transformer blocks, each with four attention heads and an MLP. Each block has 196,864 parameters, totaling 787,456 across the stack. Final layer normalization adds 128 parameters. The output projection reuses the token embedding table and adds no parameters. A detail panel breaks down one block into two normalizations, QKV and attention output projections, and two MLP projections. Percentages are shares of the full model.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
<rect width="1000" height="920" rx="16" fill="#f8fafc"/>
<g font-family="system-ui, sans-serif" text-anchor="middle" fill="#0f172a">
<text x="500" y="38" font-size="25" font-weight="700" fill="#0f172a">Where the model’s parameters live</text>
<text x="500" y="67" font-size="17" font-weight="400" fill="#475569">Vocabulary 50,257 · context 64 · width 128 · 4 blocks × 4 heads</text>
<rect x="50" y="94" width="430" height="109" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<rect x="540" y="94" width="410" height="109" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
<text x="265" y="122" font-size="19" font-weight="600" fill="#0f172a">Token IDs → token embedding lookup</text>
<text x="265" y="152" font-size="18" font-weight="400" fill="#0f172a">50,257 × 128</text>
<text x="265" y="182" font-size="18" font-weight="600" fill="#0f172a">6,432,896 parameters · 88.991%</text>
<text x="745" y="122" font-size="18" font-weight="600" fill="#0f172a">Position IDs → position embedding lookup</text>
<text x="745" y="152" font-size="18" font-weight="400" fill="#0f172a">64 × 128</text>
<text x="745" y="182" font-size="18" font-weight="600" fill="#0f172a">8,192 parameters · 0.113%</text>
<path d="M265 203 V223 H450 V242" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M745 203 V223 H550 V242" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="244" width="400" height="49" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="500" y="275" font-size="18" font-weight="600" fill="#0f172a">Add vectors → 128 features per token</text>
<path d="M500 293 V312 H265 V339" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="341" width="430" height="319" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="265" y="369" font-size="19" font-weight="700" fill="#0f172a">Four Transformer blocks, in sequence</text>
<text x="265" y="396" font-size="18" font-weight="600" fill="#0f172a">787,456 parameters · 10.894%</text>
<rect x="75" y="412" width="380" height="42" rx="8" fill="#dcfce7" stroke="#4ade80"/>
<text x="265" y="439" font-size="17" font-weight="600" fill="#0f172a">Block 1 · 4 attention heads + MLP</text>
<path d="M265 454 V468" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="470" width="380" height="42" rx="8" fill="#dcfce7" stroke="#4ade80"/>
<text x="265" y="497" font-size="17" font-weight="600" fill="#0f172a">Block 2 · 4 attention heads + MLP</text>
<path d="M265 512 V526" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="528" width="380" height="42" rx="8" fill="#dcfce7" stroke="#4ade80"/>
<text x="265" y="555" font-size="17" font-weight="600" fill="#0f172a">Block 3 · 4 attention heads + MLP</text>
<path d="M265 570 V584" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="586" width="380" height="42" rx="8" fill="#dcfce7" stroke="#4ade80"/>
<text x="265" y="613" font-size="17" font-weight="600" fill="#0f172a">Block 4 · 4 attention heads + MLP</text>
<path d="M480 433 H537" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<rect x="540" y="341" width="410" height="319" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="745" y="370" font-size="20" font-weight="700" fill="#0f172a">Inside each block</text>
<text x="745" y="398" font-size="18" font-weight="600" fill="#0f172a">196,864 learned parameters</text>
<text x="745" y="433" font-size="17" font-weight="400" fill="#0f172a">LayerNorm before attention: 128</text>
<text x="745" y="467" font-size="17" font-weight="400" fill="#0f172a">QKV projection: 49,152</text>
<text x="745" y="501" font-size="17" font-weight="400" fill="#0f172a">Attention output projection: 16,384</text>
<text x="745" y="535" font-size="17" font-weight="400" fill="#0f172a">LayerNorm before MLP: 128</text>
<text x="745" y="569" font-size="17" font-weight="400" fill="#0f172a">MLP expansion (128 → 512): 65,536</text>
<text x="745" y="603" font-size="17" font-weight="400" fill="#0f172a">MLP projection (512 → 128): 65,536</text>
<text x="745" y="640" font-size="16" font-weight="400" fill="#475569">Each block has its own weights.</text>
<path d="M265 660 V688" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="690" width="430" height="63" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="265" y="715" font-size="19" font-weight="600" fill="#0f172a">Final LayerNorm</text>
<text x="265" y="739" font-size="17" font-weight="400" fill="#0f172a">128 parameters · 0.002%</text>
<path d="M265 753 V781" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="783" width="430" height="78" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
<text x="265" y="808" font-size="18" font-weight="600" fill="#0f172a">Output projection → 50,257 logits per token</text>
<text x="265" y="831" font-size="17" font-weight="400" fill="#0f172a">Reuses the token embedding table</text>
<text x="265" y="851" font-size="16" font-weight="600" fill="#0f172a">0 additional parameters</text>
<rect x="540" y="690" width="410" height="171" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="745" y="724" font-size="25" font-weight="700" fill="#0f172a">Total: 7,228,672</text>
<text x="745" y="754" font-size="17" font-weight="400" fill="#0f172a">Unique trainable parameters</text>
<text x="745" y="787" font-size="16" font-weight="400" fill="#0f172a">Embedding weights are counted once.</text>
<text x="745" y="814" font-size="16" font-weight="400" fill="#0f172a">Masking, softmax, GELU, and residual</text>
<text x="745" y="837" font-size="16" font-weight="400" fill="#0f172a">addition add no learned parameters.</text>
<text x="500" y="898" font-size="17" font-weight="400" fill="#475569">Percentages show shares of the full model. This lab uses bias=False.</text>
</g>
</svg>
