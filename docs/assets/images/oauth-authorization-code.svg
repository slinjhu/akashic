<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1160" viewBox="0 0 900 1160" role="img" aria-labelledby="title desc">
  <title id="title">OIDC authorization code flow</title>
  <desc id="desc">Alice clicks Sign in with FileBox, which first requests example.com/login/filebox. The example.com backend prepares and stores the sign-in attempt, then returns HTTP 302 with the FileBox authorization URL in the Location header. The browser follows that redirect to FileBox. FileBox authenticates Alice and redirects her browser to example.com/callback with a code. The browser delivers the code to the backend, which exchanges it directly with FileBox for tokens. The backend prepares protection for the attempt before redirecting. After receiving tokens, it validates the ID token, finds Alice’s local account, and creates a session. It responds to the browser with a session cookie and a redirect to /notes. The browser requests that page with the cookie, and the backend returns Alice’s page and display information.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <marker id="direct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
  </defs>
  <rect width="900" height="1160" rx="16" fill="#f8fafc"/>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#0f172a">
    <text x="30" y="38" font-size="20" font-weight="650">The browser carries a code; the backend receives the tokens</text>
    <rect x="30" y="66" width="200" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="130" y="108" text-anchor="middle" font-weight="600">Alice's browser</text>
    <rect x="330" y="66" width="220" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="440" y="96" text-anchor="middle" font-weight="600">example.com</text>
    <text x="440" y="119" text-anchor="middle">backend</text>
    <rect x="650" y="66" width="220" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="760" y="96" text-anchor="middle" font-weight="600">FileBox</text>
    <text x="760" y="119" text-anchor="middle">authorization server</text>
    <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 6">
      <path d="M130 136 V1110"/><path d="M440 136 V1110"/><path d="M760 136 V770"/>
    </g>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M130 200 H440"/>
      <path d="M440 368 H130" stroke-dasharray="7 5"/>
      <path d="M130 430 H760"/>
      <path d="M760 562 H130" stroke-dasharray="7 5"/>
      <path d="M130 622 H440"/>
    </g>
    <g text-anchor="middle">
      <text x="285" y="163">1. Click “Sign in with FileBox”</text>
      <text x="285" y="187" font-family="ui-monospace, monospace" font-size="16">GET /login/filebox</text>
      <rect x="320" y="222" width="410" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="525" y="249" fill="#166534">Prepare and store the attempt with protection</text>
      <text x="525" y="275" font-size="16" fill="#475569">Build the FileBox authorization URL</text>
      <text x="285" y="324">2. HTTP 302 redirect to FileBox</text>
      <rect x="72" y="334" width="426" height="22" fill="#f8fafc"/>
      <text x="285" y="350" font-family="ui-monospace, monospace" font-size="14">Location: https://login.filebox.../authorize?...</text>
      <rect x="220" y="402" width="450" height="25" fill="#f8fafc"/>
      <text x="445" y="419">3. Browser follows redirect: GET /authorize?...</text>
      <rect x="160" y="454" width="570" height="48" rx="8" fill="#fef3c7" stroke="#d97706"/>
      <text x="445" y="484">FileBox authenticates Alice and obtains authorization</text>
      <rect x="167" y="534" width="556" height="25" fill="#f8fafc"/>
      <text x="445" y="550">4. HTTP 302 to example.com/callback?code=...</text>
      <text x="285" y="610">5. Browser follows redirect: deliver code</text>
    </g>
    <rect x="408" y="646" width="384" height="114" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <g fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#direct)">
      <path d="M440 690 H760"/>
      <path d="M760 740 H440" stroke-dasharray="7 5"/>
    </g>
    <text x="600" y="671" text-anchor="middle" fill="#166534">6. Exchange code over HTTPS</text>
    <text x="600" y="725" text-anchor="middle" fill="#166534">7. ID token + access token</text>
    <text x="600" y="786" text-anchor="middle" font-size="15" fill="#475569">Steps 6–7: backend ↔ FileBox, over HTTPS</text>
    <g text-anchor="middle">
      <rect x="240" y="807" width="480" height="76" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="480" y="836" fill="#166534">8. Validate ID token and find Alice's local account</text>
      <text x="480" y="862" font-size="16" fill="#475569">Create a local session for user-42</text>
      <text x="285" y="917">9. Set session cookie; HTTP 302 to /notes</text>
      <rect x="100" y="925" width="370" height="23" fill="#f8fafc"/>
      <text x="285" y="942" font-family="ui-monospace, monospace" font-size="14">Set-Cookie: __Host-session=******</text>
      <text x="285" y="1008">10. GET /notes with session cookie</text>
      <text x="285" y="1078">11. Return Alice's page and display information</text>
    </g>
    <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M440 965 H130" stroke-dasharray="7 5"/>
      <path d="M130 1025 H440"/>
      <path d="M440 1095 H130" stroke-dasharray="7 5"/>
    </g>
    <text x="450" y="1135" text-anchor="middle" font-size="16" fill="#475569">The UI can display Alice's name; ID and access tokens stay on the backend.</text>
  </g>
</svg>
