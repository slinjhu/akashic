ref="/akashic/tags/">Tags</a><a aria-current="page" href="/akashic/search/">Search</a></nav><div class="header-tools"><a class="search-trigger" aria-label="Search library" href="/akashic/search/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg><span>Search library</span></a><button type="button" class="theme-toggle" aria-label="Appearance: system. Switch to light." title="Appearance: system. Switch to light."><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></button></div></header><div class="app-layout"><aside class="sidebar" aria-hidden="true"></aside><main id="main-content" tabindex="-1"><div class="search-container"><p class="eyebrow">Find a connection</p><h1>Search the library</h1><p class="page-intro">Follow a topic, rediscover an idea, or find exactly what you need.</p><!--$!--><template data-dgst=""></template><p>Loading search…</p><!--/$--></div><!--$--><!--/$--></main></div><footer class="site-footer"><span>Akashic</span><span>9<!-- --> pages · A growing collection of knowledge</span></footer><script id="_R_">(globalThis["TURBOPACK"] || (globalThis["TURBOPACK"] = [])).push({"otherChunks":["static/chunks/1x6obpmlu1_c2.js","static/chunks/2fzxukf5i8xn4.js","static/chunks/2os_1h4mriomz.js","static/chunks/0n-4epopqr2bz.js"],"runtimeModuleIds":[94553]});</script><script src="/akashic/_next/static/chunks/1x6obpmlu1_c2.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:\"/akashic/_next/static/chunks/38y2-2-4i7a0r.js\"\n3:I[2779,[\"$2\"],\"Theme\"]\n4:I[22016,[\"$2\"],\"\"]\n5:I[80100,[\"$2\"],\"
