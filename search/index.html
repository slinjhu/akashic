 writing-notes.md becomes /akashic/writing-notes. Images may\nlive beside their notes or in docs/assets/.\n\nPreparing the content\n\nscripts/content.mjs scans the Markdown files and prepares data for the app. It:\n\nParses and validates front matter.Assigns a URL to each note and checks for conflicting routes.Extracts headings and anchor IDs for the table of contents.Extracts plain text for search.Copies supported assets into public/content/.Writes the note collection to .generated/library.json.\n\nlib/content.ts imports that generated index and exposes the notes, navigation\nentries, search data, unique tags, and per-tag note counts. Both .generated/ and public/content/\nare disposable outputs excluded from Git. Edit the source files in docs/;\nthe next generation step recreates the outputs.\n\nPages and shared layout\n\napp/layout.tsx defines the shared header, sidebar, appearance controls, and\nfooter. app/[[...slug]]/page.tsx handles note paths of any depth: it finds the\nmatching note and assembles its tags, content, and table of contents.\n\nThe header has Library, Tags, and Search tabs. Library shows the topic tree;\nTags shows tag counts with links to sections of the tag index; Search leaves\nthe sidebar empty. The Akashic guides are ordinary Markdown pages in Library.\nThe table of contents includes heading levels 2 through 4, indented by depth.\n\nThe same page component adds the collection cards on the Library overview and the\ngrouped listings on the tag index. /search has its own route, which reads the\nquery and selected tag from the URL in the browser.\n\nAll note routes are enumerated with generateStaticParams; unknown note routes\nare not generated on demand. Next.js uses output: \"export\" and trailing-slash\nURLs to produce an index.html per route. Search reads URL parameters in a\nclient component behind a Suspense boundary and filters the bundled note data.\nNo request-time server is needed.\n\nMarkdown rendering\n\ncomponents/markdown.tsx owns the rendering pipeline. react-markdown parses\nthe Markdown, plugins add syntax support, and our React components determine\nhow the resulting elements appear and behave.\n\nContentHow it rendersHeadings, paragraphs, and listsStandard HTML elements styled by the appTables, task lists, and footnotesGitHub-flavored Markdown supportTablesA scrollable container for narrower screensLaTeX equationsKaTeX, with bundled fontsCode blocksSyntax highlighting for the common language set plus Dockerfile, and a Copy buttonMermaid blocksDefault-size text, with source and fullscreen controlsRelative Markdown linksLinks to the corresponding app routesImagesLocally served assets with alt text\n\nThis gives us control over rendering without maintaining a Markdown parser.\nRaw HTML and executable MDX are currently disabled. New interactions can be\nimplemented as React components and connected to the renderer, following the\nsame approach as Mermaid blocks. Math and diagram dependencies are bundled\nlocally rather than fetched from a CDN.\n\nServer and browser responsibilities\n\nMost page content renders at build time. Components that need user input,\nbrowser APIs, or local state run in the browser:\n\nComponentResponsibilitycomponents/top-navigation.tsxLibrary, Tags, and Search tabs and their active statecomponents/navigation.tsxTopic tree or tag counts based on the tab, active links, and the mobile menucomponents/search.tsxText matching, result lists, and tag filteringcomponents/theme.tsxSystem appearance and saved light/dark preferencescomponents/code-block.tsxCopying code to the clipboardcomponents/mermaid.tsxRendering diagrams, fullscreen viewing, and inspecting their source\n\nSearch currently filters the library's searchable text in the browser. It\nmatches query words against titles, tags, and note text, and can restrict results\nto a selected tag. This keeps the setup small for a personal library. A much\nlarger collection could use a dedicated search index or server endpoint later.\n\nDevelopment and hot reload\n\nWith Node.js 22 or newer installed, run:\n\nmake env\nmake dev\n\nmake env installs the locked dependencies with npm ci. make dev starts\nscripts/dev.mjs, which generates the content index, watches docs/, and starts\nNext.js at http://127.0.0.1:8056.\n\nflowchart LR\n    save[\"Save a Markdown file\"] --\u003e watch[\"Content watcher\"]\n    watch --\u003e generate[\"Regenerate the index\"]\n    generate --\u003e refresh[\"Next.js detects the changed import\"]\n    refresh --\u003e browser[\"Browser updates\"]\n\nAdding, editing, or deleting notes updates the content, navigation, and search\ndata. App code also uses Next.js development refresh. Stop the server with\nCtrl+C to release port 8056.\n\nFor validation and a preview of the static export:\n\nmake check\nmake build\nnpm start\n\nmake check runs tests and TypeScript checks. make build runs\nscripts/build.mjs, regenerates content, and exports the site to out/;\n.next/ contains intermediate build files. npm start uses scripts/serve.mjs\nto preview the exported files on port 8056. Rebuild after changing notes.\n\nmake publish runs scripts/publish.mjs: it checks Git remote access, builds with\nthe Pages base path, pushes the export to gh-pages using a temporary checkout,\nand uses ordinary Git push authentication. Pages is configured once in the\nrepository's web settings; no GitHub CLI is required. Next.js prefixes navigation links;\nthe Markdown renderer explicitly prefixes local image URLs. See\npublishing instructions.\n\nWhere to extend the app\n\nChangeMain file or directoryAdd knowledgedocs/Adjust the reusable note structuretemplates/note.mdChange typography, spacing, or colorsapp/globals.cssChange the shared application layoutapp/layout.tsxChange tag placement or the table of contentsapp/[[...slug]]/page.tsxCustomize Markdown elementscomponents/markdown.tsxAdd an interactive widgetcomponents/, then connect it to the rendererAdd metadata processing or indexing behaviorscripts/content.mjsChange relative-link resolutionlib/paths.mjs\n\nThe current app has no database, editing API, or browser-based note editor.\nMarkdown files provide storage, Git provides history, and Next.js provides the\nreading and interaction layer."])</script><script>self.__next_f.push([1,"11:T1342,"])</script><script>self.__next_f.push([1,"Getting started with Akashic\n\nA Markdown-first personal knowledge library built with Next.js, React, and TypeScript.\n\nPreview locally\n\nInstall Node.js 22 or newer, then run these commands from the repository root:\n\nmake env\nmake dev\n\nOpen http://127.0.0.1:8056. make env runs npm ci using the lockfile.\nmake dev watches both app code and docs/: saved notes, added or deleted pages,\nmetadata, and images update automatically. Stop the server with Ctrl+C.\n\nWrite a note\n\nCopy templates/note.md into a subject folder under docs/.Set its title, tags, and optional description, then write the content.Add an index.md to introduce a subject when useful.\n\nNavigation follows folders automatically; no navigation list needs updating.\nUse Library for the topic tree, Tags for the grouped tag index, and Search for\ntitles, tags, and note text. On Tags, the sidebar lists tags with note counts;\nclick one to scroll to its section. Search currently has no sidebar content.\nThese Akashic guides live in Library alongside other notes.\n\nTags appear above the title unless the note sets hide: [tags]. The appearance\nbutton shows the current mode and cycles System → Light → Dark → System.\nSystem is the default, and the choice is saved. Dates belong in Git history.\nSee the writing guide for equations, Mermaid\ndiagrams, images, plots, and links.\n\nBuild\n\nmake check\nmake build\nnpm start\n\nmake check runs tests and TypeScript checks. make build exports the site to\nout/, containing HTML, CSS, JavaScript, and assets. npm start previews those\nfiles on port 8056; use PORT=8057 npm start if the development server is already\nrunning. Rebuild after changing notes. Production hosting needs only a static\nfile server, with no Node.js runtime or database.\n\nPublish to GitHub Pages\n\nEnsure Git can push to origin, then run the command below. Publishing uses the\nsame SSH alias and credentials as git push; the GitHub CLI is not needed.\n\nmake publish\n\nThis builds the current working files and pushes only the generated site to the\ngh-pages branch. It keeps deployment history, leaves the source branch alone,\nand adds .nojekyll. All notes and supported assets\nunder docs/ are included, including uncommitted local edits.\n\nFor slinjhu/akashic, the default URL is https://slinjhu.github.io/akashic/.\nAfter the first push, open the repository's Settings → Pages. Select\nDeploy from a branch, choose gh-pages and / (root), and save.\nThis is a one-time setup; subsequent make publish runs trigger deployment\nautomatically. Deployment runs asynchronously after the push. See\nGitHub Pages publishing sources.\n\nThe publish command determines the project path from origin. If using a custom\ndomain, configure it in Pages settings and pass PAGES_DOMAIN=notes.example.com\non every publish. This builds for the domain root and writes a CNAME file.\n\nTo build and preview the project-path version without publishing:\n\nNEXT_PUBLIC_BASE_PATH=/akashic make build\nnpm start\n\nThe preview serves it at http://127.0.0.1:8056/akashic/. A plain make build\nexports for the domain root. The deployment path is fixed at build time.\n\nRendering and interaction\n\ncomponents/markdown.tsx owns the Markdown-to-React rendering pipeline. It uses\nreact-markdown, GFM tables/task lists/footnotes, syntax highlighting, and KaTeX\nfor equations. Raw HTML and executable MDX are not enabled. Relative .md links\nresolve to page URLs; images can live beside notes or in docs/assets/.\n\nMermaid blocks render with a local JavaScript bundle at the page's default text\nsize, with source and fullscreen controls. Wide diagrams scroll instead of\nscaling the text. Code blocks have a copy button. Add React components in components/\nand register them in the Markdown renderer to extend interactions. The app owns\nthe layout and styling, without a documentation theme or template overrides.\n\nMath fonts, syntax highlighting, and Mermaid are bundled locally, with no CDN\ndependency. scripts/content.mjs validates front matter, indexes headings and\nnotes, and copies supported assets into public/content/. Its generated JSON\nfeeds build-time page rendering and browser search. Search query parameters are\nread in the browser. /search is reserved for the app;\ndocs/tags.md supplies the introduction to the generated /tags index.\n\nLayout\n\napp/                  Next.js routes, layout, and styles\ncomponents/           Markdown rendering and interactive components\nlib/                  Content types and relative-link resolution\nscripts/              Content indexing and development watcher\ntests/                Content and path regression tests\ndocs/                 Notes, subject indexes, and assets\ntemplates/note.md      Reusable note template (not published)\n.generated/           Generated content index (ignored)\npublic/content/       Generated copies of note assets (ignored)\nout/                  Static site ready for hosting (ignored)\npackage-lock.json     Locked Node.js dependencies"])</script><script>self.__next_f.push([1,"12:Tf78,"])</script><script>self.__next_f.push([1,"Writing notes\n\nOrganize by subject\n\nUse paths such as docs/mathematics/linear-algebra/eigenvectors.md. Add an\nindex.md within each folder when you want a subject overview. The sidebar follows\nthe folder hierarchy automatically. Use tags to connect notes across subjects.\n\nMetadata\n\nBegin each note with YAML front matter. Use title and tags; description is\noptional. Reuse existing tag spellings: tags are case-sensitive, so Docker\nand docker would create separate entries.\nGit history records when content changes, so notes do not need date fields.\n\n---\ntitle: Eigenvectors\ndescription: Directions preserved by a linear transformation.\ntags:\n  - mathematics\n  - linear-algebra\n---\n\nCopy templates/note.md from the repository root as a starting point. Templates\nare outside docs/ so they do not appear in the published site or search results.\n\nTags normally appear above the page title. Add hide: [tags] to front matter\nto hide that row while keeping the note in tag listings and search filters.\n\nHeadings and section numbers\n\nUse one # heading for the page title, then ##, ###, and #### for sections,\nsubsections, and sub-subsections. These three levels appear in the table of\ncontents with matching indentation. Deeper headings still render in the page\nbut are not included in the table of contents.\n\nSection numbers are part of the Markdown text, not automatic counters:\n\n## 1. Primer\n### 1.1. Build an image\n#### 1.1.1. Name the image\n## 2. Large images\n\nUpdate those numbers when reorganizing a note. Heading links are generated from\nthe heading text, so changing a heading or its number also changes its anchor.\n\nCode blocks\n\nGive fenced code blocks a language such as python, sh, json, or\ndockerfile to enable syntax highlighting. The renderer supports its common\nlanguage set plus Dockerfile; unknown languages remain plain text. Unlabelled\nblocks are not automatically detected. Each code block has a Copy button.\n\nEquations\n\nUse $...$ for inline math, such as A\\mathbf{v} = \\lambda\\mathbf{v}.\nUse $$ on separate lines for display equations:\n\n$$\n\\int_0^1 x^2\\,dx = \\frac{1}{3}\n$$\n\n\\int_0^1 x^2\\,dx = \\frac{1}{3}\n\nDiagrams\n\nDiagrams use the page's default font and text size. Wide diagrams scroll instead\nof scaling the text. Use Source to inspect the Mermaid definition, or Fullscreen\nfor more room. Press Escape or Exit fullscreen to return to the page. Their colors\nfollow the selected light or dark appearance.\n\nUse a fenced block with the language mermaid:\n\n```mermaid\nflowchart LR\n  Learn --\u003e Capture --\u003e Connect --\u003e Revisit\n  Revisit --\u003e Learn\n```\n\nflowchart LR\n  Learn --\u003e Capture --\u003e Connect --\u003e Revisit\n  Revisit --\u003e Learn\n\nImages and plots\n\nStore images in docs/assets/images/ or next to the note that uses them. Embed\nthem with a relative path and meaningful alt text:\n\n![An example linear plot](../assets/images/example-plot.svg)\n\nAn example linear plot\n\nFor Python plots, export an SVG or PNG and embed it the same way. For example,\nin a separate environment with Matplotlib installed:\n\nfrom pathlib import Path\nimport matplotlib.pyplot as plt\n\noutput = Path(\"docs/assets/images/my-plot.svg\")\noutput.parent.mkdir(parents=True, exist_ok=True)\nfig, ax = plt.subplots()\nax.plot([0, 1, 2], [0, 1, 2])\nfig.savefig(output, bbox_inches=\"tight\")\nplt.close(fig)\n\nLink ideas and sources\n\nUse relative Markdown links, such as [Akashic](index.md), to connect notes.\nLink sources near the claims they support; a Sources section can also collect\nreferences for further reading.\n\nFind notes\n\nUse the Library tab's sidebar for the subject hierarchy and Search for text.\nThe Tags tab groups related notes across subjects. Its sidebar\nshows note counts and jumps to each tag's section.\n\nPreview changes\n\nRun make dev and open http://127.0.0.1:8056. Saving a Markdown file updates\nthe page, navigation, and search index automatically. Code blocks include a Copy\nbutton, and the Appearance icon toggle lets you follow the system or choose light or\ndark mode."])</script><script>self.__next_f.push([1,"13:T7201,"])</script><script>self.__next_f.push([1,"AWS networking\n\nStart with a network that has no internet connection. Put a server inside it. Then add only what that server needs to communicate.\n\nWe'll use one example throughout: a VPC with address range 10.0.0.0/20. These notes cover ordinary regional VPCs and IPv4; the addresses are illustrative.\n\n1. Start with an empty VPC\n\nA VPC (Virtual Private Cloud) is your own logically isolated network in an AWS Region. Think of it as the boundary around the network you are building.\n\nGive it an address range:\n\nflowchart TB\n    vpc[\"VPC: 10.0.0.0/20\u003cbr/\u003eNo servers yet\u003cbr/\u003eNo internet connection\"]\n\nFor this example, we deliberately start without an internet gateway or connections to other networks. AWS's default VPC and setup wizards may already include internet connectivity, so they may not look like this starting point. See AWS internet gateway documentation.\n\nSo far: we have a network boundary and an address pool. We have not created a path to the internet.\n\n2. Understand the address range: CIDR\n\n10.0.0.0/20 is CIDR notation, a compact way to describe a range of IP addresses. Each number between the dots is an octet: a group of 8 bits. Four octets make a 32-bit IPv4 address.\n\n---\nconfig:\n  themeCSS: |\n    .packetBlock:nth-of-type(1) { fill: rgba(96, 165, 250, 0.22); }\n    .packetBlock:nth-of-type(2) { fill: rgba(52, 211, 153, 0.22); }\n  packet:\n    showBits: false\n    paddingX: 0\n    bitWidth: 22\n    rowHeight: 64\n---\npacket\n0-19: \"Network ID — 20 fixed bits\"\n20-31: \"Host ID — 12 variable bits\"\n\n/20 means 20 fixed network bits, leaving 32 − 20 = 12 variable host bits. It fixes the first two octets (10.0) and the first four bits of the third octet. The third octet can range from 0 to 15, and the last from 0 to 255: the full range is 10.0.0.0 through 10.0.15.255.\n\nThe larger the number after /, the fewer bits can vary—and the smaller the address pool:\n\nExampleFixed partPart that can varyTotal addresses10.0.0.0/20First 20 bitsLast 12 bits4,09610.0.1.0/24First 24 bits: 10.0.1Last number25610.0.1.25/32All 32 bitsNone1\n\nThe /24 and /32 boundaries line up with the dots because they are multiples of 8. Our /20 boundary falls inside the third octet. The rule is always the same: /n fixes the first n bits, leaving 2^(32 − n) total addresses.\n\nFor now, our /20 is the VPC's address pool. Next, we'll take a smaller /24 range from it for a subnet.\n\n3. Add a subnet and a server\n\nA subnet takes a smaller address range from the VPC. This is where you place a server, such as an EC2 instance, AWS's virtual machine.\n\nflowchart TB\n    subgraph vpc[\"VPC: 10.0.0.0/20\"]\n        subgraph subnetA[\"Subnet A: 10.0.1.0/24\"]\n            app[\"App\u003cbr/\u003e10.0.1.25\"]\n        end\n    end\n\n10.0.1.0/24 covers 10.0.1.0 through 10.0.1.255. AWS reserves some addresses in a subnet, so not every address is available for servers.\n\nA VPC belongs to one Region. Each subnet belongs to exactly one Availability Zone (AZ) within that Region. A VPC can contain many subnets, including several in the same AZ or subnets in different AZs. See AWS subnet concepts.\n\nAn AZ is one or more data centers with separate power and networking infrastructure. Its purpose is failure isolation: a problem in one AZ is less likely to affect another. AZs within a Region have fast network connections so an application can run across them. See AWS Availability Zones.\n\nWe start with one subnet to learn the pieces. For a production application that must survive an AZ outage, we'll need subnets and working copies of the application in multiple AZs. Creating extra subnets alone does not create those copies.\n\nSo far: the app has an address inside our network. It still has no internet path.\n\n4. Add a second subnet: how does traffic find its way?\n\nPut a database in another subnet:\n\nflowchart LR\n    subgraph vpc[\"VPC: 10.0.0.0/20\"]\n        direction LR\n        subgraph subnetA[\"Subnet A: 10.0.1.0/24\"]\n            app[\"App\u003cbr/\u003e10.0.1.25\"]\n        end\n        subgraph subnetB[\"Subnet B: 10.0.2.0/24\"]\n            database[\"Database\u003cbr/\u003e10.0.2.30\"]\n        end\n        app --\u003e|\"Local route\"| database\n    end\n\nWhen the app connects to 10.0.2.30, AWS needs to know where to send the traffic. A route table supplies that answer.\n\nRead each route as: “For this destination range, send traffic to this target.” Our starting table has one route:\n\nDestinationTargetMeaning10.0.0.0/20localKeep traffic for this VPC inside this VPC\n\nThe database address falls within that range, so the app has a local path to it. This connection stays inside the VPC.\n\nEach subnet uses one subnet route table at a time. Subnets can share a table; without an explicit association, a subnet uses the VPC's main table. AWS creates a local route for the VPC's address range. See AWS subnet route tables.\n\nSeparate subnets do not automatically block communication. A subnet divides addresses and determines placement. Traffic restrictions are a separate concern.\n\n5. Add permission to use the path\n\nA route answers “Where does traffic go?” A security group answers “Is this traffic allowed?”\n\nFor the app to connect to the database, we need both:\n\nA path to the database's private IP, supplied here by the local route.Security rules allowing the connection: app outbound traffic and database inbound traffic on the database port.\n\nFor example, the database's security group could allow inbound TCP 5432 from the app's security group. A port identifies the service receiving a connection; PostgreSQL commonly listens on port 5432. The database must actually be running and listening there.\n\nSecurity groups contain allow rules, rather than explicit deny rules.\n\n5.1. What does “stateful” mean? Can traffic go both ways?\n\nTraffic can flow both ways within an allowed connection. Permission to start a new connection is a separate question.\n\nSuppose the app starts a database connection on TCP port 5432:\n\nsequenceDiagram\n    participant App as App: 10.0.1.25\n    participant DB as Database: 10.0.2.30\n    App-\u003e\u003eDB: Start connection to port 5432\n    Note over App,DB: Requires app outbound and database inbound permission\n    DB--\u003e\u003eApp: Return traffic on the allowed connection\n    Note over App,DB: Security groups automatically allow this return traffic\n\nThe security groups track the connection. The database's replies are allowed even without a matching outbound rule on its security group, and the app can receive those replies without a matching inbound rule on its security group. This connection tracking is what stateful means. See AWS security groups.\n\nNow suppose the database tries to start a separate connection to a service running on the app. That is not a reply. It needs database outbound permission and app inbound permission for that new connection.\n\nTrafficWhat the security groups requireApp starts a connection to the databaseApp outbound and database inbound rules must allow itDatabase sends replies on that connectionAutomatically allowed as return trafficDatabase starts a separate connection to the appDatabase outbound and app inbound rules must allow it\n\nThe same principle applies when the app calls an external API: its response can return without an inbound security-group rule specifically allowing it. This automatic permission applies to security groups; it does not create a missing route or bypass other network filters.\n\nThere is also a subnet-level filter called a network ACL. We'll assume the default allow-all ACL for our example and return to it later.\n\nSo far: the app and database can communicate privately when the rules allow it. Neither needs internet access for this connection.\n\n6. Add an internet gateway: public versus private subnets\n\nSuppose we want to add a web server that visitors can reach from the internet. Keep the app and database where they are, and add Subnet C for the web server.\n\nAn internet gateway (IGW) connects a VPC to the internet. Attach one to the VPC and give Subnet C a route to it. This makes Subnet C public; Subnets A and B keep their local-only routes:\n\nflowchart LR\n    subgraph vpc[\"VPC: 10.0.0.0/20\"]\n        direction LR\n        subgraph subnetA[\"Private subnet A: 10.0.1.0/24\"]\n            app[\"App\u003cbr/\u003e10.0.1.25\"]\n        end\n        subgraph subnetB[\"Private subnet B: 10.0.2.0/24\"]\n            database[\"Database\u003cbr/\u003e10.0.2.30\"]\n        end\n        subgraph subnetC[\"Public subnet C: 10.0.3.0/24\"]\n            web[\"Web server\u003cbr/\u003ePrivate IP: 10.0.3.40\u003cbr/\u003ePublic IPv4 address assigned\"]\n        end\n        igw[\"Internet gateway\u003cbr/\u003eAttached to the VPC\"]\n        app --\u003e|\"Local route\"| database\n        web \u003c--\u003e|\"Subnet C route: 0.0.0.0/0 to IGW\"| igw\n    end\n    igw \u003c--\u003e internet[\"Internet\"]\n\nThe IGW attaches to the VPC, not to an individual subnet. The arrows show the web server's internet path; security rules still control which connections are allowed.\n\nSubnet C's route table now contains:\n\nDestinationTargetMeaning10.0.0.0/20localVPC destinations stay local0.0.0.0/0Internet gatewaySend other IPv4 traffic toward the internet\n\n0.0.0.0/0 means all IPv4 addresses. It acts as the fallback because routing chooses the most specific matching range. The database's 10.0.2.30 address still matches the more specific local route.\n\nSubnet C is now a public subnet because it has a direct route to the IGW. Keep Subnets A and B on their local-only table, and they remain private.\n\nSubnet descriptionWhat its routes meanPublicHas a direct route to an internet gatewayPrivateHas no direct route to an internet gatewayIsolatedHas no routes to destinations outside the VPC\n\nOur local-only Subnets A and B are isolated as well as private. A private subnet can gain other connections later without becoming public. See AWS subnet types.\n\nTo make the web server reachable, give it a public IPv4 address and allow its web port in its security group. It keeps its private address too: the IGW maps between the two addresses. The web application must be listening on that port. See AWS internet gateway documentation.\n\nThe distinction: “public” describes a subnet's route. It does not mean every resource in it is reachable from the internet. Attaching an IGW alone also does not make all subnets public.\n\n7. Keep the app private, but let it call the internet\n\nNow the app at 10.0.1.25 needs to call an external API. We want to keep it in private Subnet A with only its private IP.\n\nAdd a public NAT gateway to public Subnet C. NAT means Network Address Translation: it lets the app use a shared outward-facing address. This example uses a zonal NAT gateway with an Elastic IP, a public IPv4 address allocated to your AWS account.\n\nflowchart LR\n    subgraph vpc[\"VPC\"]\n        subgraph private[\"Private subnet A\"]\n            app[\"App: 10.0.1.25\u003cbr/\u003ePrivate IP only\"]\n        end\n        subgraph public[\"Public subnet C\"]\n            nat[\"Public NAT gateway\"]\n        end\n        igw[\"Internet gateway\"]\n    end\n    app --\u003e nat --\u003e igw --\u003e internet[\"External API\"]\n\nKeep Subnet C's route to the IGW. Give Subnet A its own table with a default route to NAT; leave the database's Subnet B on its local-only table:\n\nSubnetDestinationTargetMeaningPrivate A10.0.0.0/20localTraffic to other VPC addresses stays inside the VPCPrivate A0.0.0.0/0NAT gatewayOther IPv4 traffic goes to NAT in public Subnet CPublic C10.0.0.0/20localTraffic to other VPC addresses stays inside the VPCPublic C0.0.0.0/0Internet gatewayOther IPv4 traffic, including traffic forwarded by NAT, goes toward the internet\n\nNAT translates addresses and tracks connections. The external API sees the NAT gateway's Elastic IP, and its replies return to the app through NAT.\n\nAn external host cannot use this NAT path to start an unsolicited connection to the app. The app can initiate a connection and receive its responses. See AWS NAT gateways.\n\nSo far: the app can call the internet while its subnet remains private. Its default route points to NAT, not directly to the IGW.\n\n8. Reach S3 through a gateway endpoint\n\nSuppose the app now needs to read files from Amazon S3, AWS's object storage service. It could reach S3 through NAT, but we can give S3 traffic a dedicated path that does not need NAT or an internet gateway.\n\n8.1. What is a gateway endpoint?\n\nSuppose our VPC and a bucket named bucket are both in us-west-2. The app wants to read report.csv, so it sends an HTTPS request to https://bucket.s3.us-west-2.amazonaws.com/report.csv. The hostname identifies the bucket and Region; the path identifies the object. A bucket is a logical collection of objects, not a server with its own dedicated IP. See S3 bucket hostnames.\n\nBefore connecting, the app needs an IP address for that hostname. Assuming the VPC uses AWS's default DNS configuration, the instance asks the Amazon-provided DNS resolver, also called Route 53 Resolver, to resolve the name. The resolver obtains the DNS answer and returns S3 service IP addresses. With the gateway endpoint path described here, these are public S3 IP addresses, not private addresses allocated from our subnet. The app connects to one of them on HTTPS port 443. See Amazon DNS.\n\nThe destination IP tells AWS's VPC routing infrastructure which route to use. Once we associate an S3 gateway endpoint with Subnet A's route table, that table contains a route for the Region's S3 address ranges. The resolved S3 IP matches this route, which is more specific than the default NAT route. AWS therefore carries the traffic through the gateway endpoint path to S3, without using NAT or the internet gateway. The destination IP is public, but the route keeps this connection on the AWS network. DNS supplies the address; the route table selects the path. See AWS gateway endpoint routing.\n\nAt S3, the request's hostname identifies bucket and its path identifies report.csv. S3 checks access permissions and handles finding and returning the object through its own internal infrastructure. Your VPC route gets the request to the S3 service; S3 handles the machines and storage behind it. Neither DNS nor your route table gives you the address of a particular disk or machine storing that object.\n\nThe gateway endpoint is the VPC resource that makes this service-specific route available. It has an endpoint ID, such as vpce-example, and an access policy, but no subnet private IP, network interface (ENI), or server for you to manage. “Gateway” describes its role in providing a path out to S3. AWS implements that path in its managed network, and the route points to the endpoint ID rather than to a gateway machine's IP.\n\n8.2. Add the S3 route and keep NAT\n\nCreate the S3 gateway endpoint in our VPC and select Subnet A's route table. AWS automatically adds the S3 route to that table. Keep the existing default route to NAT:\n\nDestinationTargetMeaning10.0.0.0/20localTraffic to VPC addresses stays inside the VPCRegional S3 prefix listS3 gateway endpointMatching S3 traffic uses the VPC's endpoint0.0.0.0/0NAT gatewayOther IPv4 traffic continues through NAT\n\nA prefix list is a collection of IP ranges; AWS maintains this one for the service. Traffic matching it follows the endpoint route.\n\nTo give another subnet the same path, associate its route table with this endpoint too. If two subnets share an associated route table, both already use its endpoint route. You do not need one gateway endpoint per subnet. See S3 gateway endpoint route-table associations.\n\nThe more specific S3 route takes precedence over the default NAT route for matching traffic. An external API still uses NAT. Adding the endpoint gives S3 its own path without removing the app's existing internet access.\n\nS3 has not moved into our subnet. The endpoint gives us a route to the AWS-managed service. Gateway endpoints support S3 and DynamoDB. See AWS gateway endpoints.\n\nSo far: the app reaches the database locally, S3 through the VPC's gateway endpoint, and external APIs through NAT.\n\n8.3. Access a bucket in another Region\n\nSuppose the app remains in us-west-2, but now needs an object from a bucket in us-east-1. It calls that bucket's regional hostname, such as bucket.s3.us-east-1.amazonaws.com. DNS resolves the name to an S3 service IP for the destination Region. That address does not match the us-west-2 S3 prefix list in our route table, so the default route to NAT takes over.\n\nflowchart LR\n    subgraph west[\"VPC in us-west-2\"]\n        app[\"App\"]\n        endpoint[\"S3 gateway endpoint\u003cbr/\u003eus-west-2 destinations\"]\n        nat[\"NAT gateway\"]\n        igw[\"Internet gateway\"]\n        app --\u003e|\"Matches regional S3 route\"| endpoint\n        app --\u003e|\"Other Region: default route\"| nat\n        nat --\u003e igw\n    end\n    endpoint --\u003e localS3[\"S3 in us-west-2\"]\n    igw --\u003e remoteS3[\"S3 in us-east-1\"]\n\nThe existing NAT and internet gateway provide this path; adding another S3 gateway endpoint in our VPC would not extend it to another Region. Gateway endpoints are regional, and their S3 routes cover the service in that Region. Although the cross-Region request uses the internet gateway, AWS documents that this S3 traffic stays on the AWS network. See AWS gateway endpoint routing.\n\nThe app still needs permission to access the remote bucket, and its network rules must allow the connection. If we removed NAT without providing another suitable path, the local gateway endpoint would continue to serve matching local-Region S3 traffic, but it would not make the remote bucket reachable.\n\n8.4. Control access with a gateway endpoint policy\n\nThe S3 route selects traffic by destination IP range, so it can carry requests for many buckets in the Region. An endpoint policy narrows what callers may do through that path. It is attached to the gateway endpoint and can restrict the calling identity, S3 actions, and resources. The default policy places no additional restriction on endpoint access; it does not make buckets public or grant callers S3 permissions.\n\nSuppose our app should only read objects in bucket. We could give the endpoint this policy, shown as a decoded JSON policy document:\n\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n            \"Principal\": \"*\",\n            \"Action\": [\n                \"s3:GetObject\"\n            ],\n            \"Resource\": [\n                \"arn:aws:s3:::bucket/*\"\n            ]\n        }\n    ]\n}\n\nPrincipal: \"*\" applies this endpoint allowance to any caller using the endpoint; it does not make the bucket public. The action permits reading objects, and the resource covers object keys inside bucket. A request for report.csv can pass this endpoint check, but the caller still needs S3 authorization through the applicable IAM and bucket policies. Uploading an object, listing the bucket, or reading another bucket would fail the endpoint check under this policy.\n\nA rejected request does not fall back to NAT: routing has already selected the endpoint path. Conversely, this policy does not govern requests that use a different path, such as our cross-Region NAT connection. Restricting a bucket to requests from a particular endpoint requires a bucket policy. See AWS endpoint policies.\n\n9. Reach another service through a private IP\n\nNow the app needs to retrieve a password from Amazon Secrets Manager, an AWS service for storing and retrieving secrets. It supports a different kind of VPC endpoint: an interface endpoint.\n\nWe create an interface endpoint with a network interface, called an ENI, in Subnet A. Its private IP, 10.0.1.50, is our entry point to Secrets Manager. AWS PrivateLink carries traffic from that interface to the service outside our VPC, without NAT or an internet gateway.\n\nflowchart LR\n    subgraph vpc[\"VPC: 10.0.0.0/20\"]\n        subgraph subnetA[\"Subnet A: 10.0.1.0/24\"]\n            app[\"App\u003cbr/\u003e10.0.1.25\"]\n            ep[\"Endpoint network interface (ENI)\u003cbr/\u003e10.0.1.50\"]\n            app --\u003e ep\n        end\n    end\n    ep --\u003e|AWS PrivateLink| service[\"Secrets Manager\"]\n\nWith private DNS enabled, the app's usual Secrets Manager hostname resolves to this private IP. The app connects to it using the VPC's existing local route.\n\n9.1. Choose subnets and enable private DNS\n\nThe interface endpoint belongs to the VPC, while its ENIs live in the subnets we select. Here we select only Subnet A. Resources in Subnet B can also reach that ENI, provided security rules allow it; they do not need their own ENI.\n\nSelecting two subnets in different Availability Zones creates two ENIs for the same endpoint, each with its own private IP. An interface endpoint allows only one selected subnet per AZ. These can be private subnets. See AWS endpoint subnet configuration.\n\nDNS turns a hostname into an IP address. Enabling private DNS for the endpoint makes the service's usual hostname resolve inside the VPC to the endpoint's private IPs, so the app can keep using the same hostname. This requires VPC DNS support and DNS hostnames to be enabled. No S3-style service route is needed: the destination is already inside the VPC. See AWS interface endpoints.\n\n9.2. Allow connections with a security group\n\nA security group is created in a VPC and associated with network interfaces (ENIs), rather than with a subnet. Our EC2 app has an ENI too: its address is 10.0.1.25. When we say \"the app's security group,\" we mean the group attached to that interface. The endpoint's security group is attached to its ENI at 10.0.1.50. A group is reusable: multiple ENIs, including those in different subnets of the VPC, can use the same group. See AWS security group associations.\n\nThe app has a network path to 10.0.1.50, but the endpoint's security group must allow the connection. Give it an inbound rule allowing TCP 443 from the app's security group. Referencing that group identifies the permitted source interfaces; it does not copy their security group rules. The app's outbound rules must also allow the HTTPS connection. Replies are automatically permitted because security groups are stateful. See AWS security group rules.\n\nThese rules control connections to the endpoint ENIs. They do not distinguish reading a password from changing it. A gateway endpoint has no ENI or security group of its own, although the app's network rules still apply. See interface endpoint security groups and AWS gateway endpoints.\n\n9.3. Limit requests with an endpoint policy\n\nOnce the connection is allowed, an endpoint policy limits the service requests that can pass through it. The policy belongs to the interface endpoint, not to an individual ENI; it applies across all ENIs of that endpoint. Endpoint policies are available when the service supports them, as Secrets Manager does. See AWS endpoint policies.\n\nTo allow only reading one secret through this endpoint, attach this policy:\n\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n            \"Principal\": \"*\",\n            \"Action\": [\n                \"secretsmanager:GetSecretValue\"\n            ],\n            \"Resource\": [\n                \"arn:aws:secretsmanager:us-west-2:111122223333:secret:app-password-AbCdEf\"\n            ]\n        }\n    ]\n}\n\nReplace the example ARN with the secret's actual ARN, including its generated suffix. This endpoint policy allows a read request for that secret to pass the endpoint check; writes and requests for other secrets fail it. The caller still needs permission to read the secret through the applicable IAM and resource policies, plus any required KMS permission. See AWS Secrets Manager endpoint policies and GetSecretValue permissions.\n\nThis works like our S3 gateway endpoint policy: both restrict who may perform which actions on which resources through that endpoint. Neither grants service access by itself nor restricts requests made through a different path.\n\n9.4. Compare gateway and interface endpoints\n\nWe now have two private paths: a gateway endpoint for S3 and an interface endpoint for Secrets Manager. Both are VPC endpoints, but they give traffic a different entry point. With the gateway endpoint, packets remain addressed to S3's service IPs, and the route table selects the endpoint path. With the interface endpoint, the app sends HTTPS traffic to 10.0.1.50:443, and AWS PrivateLink carries it onward to Secrets Manager. The ENI is part of that data path. Its IP identifies an AWS-managed entry point, while the service itself runs outside our VPC. See gateway endpoint routing and AWS PrivateLink connectivity.\n\nThat difference in entry point also determines where we apply network controls and how AWS charges for the connection:\n\nFeatureGateway endpointInterface endpointEntry pointA service-specific route in selected route tablesAn ENI with a private IP in each selected subnetEndpoint security groupNoneControls connections to the endpoint ENIsEndpoint chargesNo additional hourly or data-processing chargeHourly charge per AZ, plus data-processing charges\n\nFor an interface endpoint, we pay for each AZ where it is provisioned, even when idle, and for data processed in both requests and responses. Selecting subnets in two AZs therefore adds two hourly charges. A gateway endpoint has neither of these endpoint charges, although the underlying service's normal charges still apply. See AWS PrivateLink pricing and S3 gateway endpoint pricing.\n\nWhether we can choose between the two depends first on the service. AWS offers gateway endpoints for S3 and DynamoDB; services such as Secrets Manager and ECR use interface endpoints. S3 supports both, so our app's location and needs determine which fits. Its same-Region S3 requests can use the gateway endpoint without additional endpoint charges. If the client were on premises, an S3 interface endpoint could provide access through VPN or Direct Connect, whereas that client could not use our VPC's gateway endpoint directly. Both paths keep S3 traffic on the AWS network. See AWS gateway endpoints and AWS S3 endpoint comparison.\n\nOnce a path meets those connectivity needs, throughput becomes another consideration for large transfers. AWS documents interface endpoint bandwidth of up to 10 Gbps per Availability Zone by default, automatically scaling up to 100 Gbps per AZ. Many clients transferring data through the same endpoint share that capacity. These figures describe how much data the path can carry, rather than the latency of an individual request, so workloads that need high throughput should check the limits and measure their actual path. They help us assess capacity, but do not establish that gateway endpoints are always faster or explain why AWS originally created the two types. See AWS PrivateLink quotas.\n\n10. Add the remaining permission checks\n\nWe already used security groups. Once the path exists, additional controls can still block traffic or deny a service operation:\n\nIAM (Identity and Access Management) controls who may perform AWS operations. For example, a network path to S3 lets the app send a request, but its identity still needs permission to read the requested object.\n\nLayerQuestion it answersWhat to rememberSecurity groupMay this resource send or receive the traffic?Stateful; allows replies to an allowed connectionNetwork ACLMay this traffic cross the subnet boundary?Stateless; rules must allow both request and response trafficIAM and resource policiesMay this caller perform the AWS operation?Network reachability does not grant service accessEndpoint policy, where supportedMay this request pass through the endpoint?Adds a restriction; does not replace service authorization\n\nCustom ACLs can block replies if they do not allow the applicable return ports. The default ACL initially allows inbound and outbound traffic. See AWS network ACLs.\n\nFor EC2, omitting a security group means AWS uses the VPC's default group. Its original rules allow inbound traffic from resources associated with that same group and allow outbound traffic. They do not allow arbitrary inbound internet traffic. Those rules can be edited, and launch tools may select a different group, so check the actual association. See AWS default security groups.\n\nA path and permission are separate requirements. Allowing HTTPS does not create a route. Creating an endpoint does not grant access to every resource behind it.\n\n11. Trace any connection with the same questions\n\nOnce the pieces are familiar, follow one request from start to finish:\n\nWhere is the client? Find its VPC, subnet, and private IP.What address is it calling? Resolve the hostname, if it uses one.Which route matches? Look at the subnet's route table and choose the most specific match.Where does that route lead? Follow the local path, IGW, NAT, or endpoint, including any onward connection.Is the connection allowed? Check security groups, ACLs, and the destination's listening port. Include the response path.Is the operation allowed? For AWS services, check credentials, IAM, resource policies, and endpoint policies.\n\nFor example, an S3 request can use a gateway endpoint even when DNS returns a public IP. A Secrets Manager request can use an interface endpoint because private DNS returns a private IP. An external API request can use NAT because it matches the default route.\n\nThe network becomes easier to reason about when you follow a specific destination instead of trying to memorize the whole architecture at once."])</script><script>self.__next_f.push([1,"14:T3f75,"])</script><script>self.__next_f.push([1,"LLM datasets\n\nLLM datasets serve different purposes. Some provide vast collections of text\nfor learning language and knowledge. Others demonstrate how to answer requests,\ncompare alternative answers, or test capabilities on held-out problems.\n\nThis note surveys representative public datasets by category. These are\nrecognizable names in published model recipes and evaluations, not a ranking\nof private industry usage. Public datasets let us inspect the ingredients;\nthey do not reveal the complete training mixtures of proprietary models.\nThe focus is text and code, rather than image, audio, or video training.\n\n1. Pretraining datasets\n\nDuring pretraining, a typical decoder language model learns\nto predict subsequent tokens in documents. A token is a piece of text defined\nby a tokenizer; it is not necessarily a word.\n\nAn illustrative record might look like this:\n\n{\"text\": \"Plants use sunlight to convert water and carbon dioxide into sugars...\", \"source\": \"web\"}\n\nThere is no user question or preferred response here. The document itself\nsupplies the prediction targets. The snippets in this note are invented examples\nof record shapes, not excerpts or exact schemas from the named datasets.\n\n1.1. Common Crawl: the raw source behind many corpora\n\nCreated by: the nonprofit Common Crawl Foundation. About Common Crawl.\n\nMotivation: make large-scale web data accessible without every team operating\nits own crawler. Common Crawl holds petabytes of web archives collected since\n2008, with new crawls generally published monthly. It includes web responses,\nmetadata, and extracted text. See Common Crawl's overview.\n\nScale: the accumulated archive totals more than 10 petabytes, according to\nthe foundation's About page. For a concrete\nmonthly example, the September 2026 release (CC-MAIN-2026-39) contains:\n\nMeasureSizeWeb page captures2.17 billionRegistered domains represented33.2 millionURLs not visited in previous crawls587.2 millionUncompressed content361.4 TiBCompressed web archives (WARC)82.79 TiBCompressed extracted text (WET)5.89 TiB\n\nThese are figures for one release, not the whole archive. WARC stores archived\nweb responses; WET contains extracted plain text, so their sizes describe\ndifferent representations. One TiB is approximately 1.10 TB. See the\nSeptember 2026 release announcement.\n\nPage captures across releases can revisit the same URLs. Archive size therefore\ndoes not equal unique, cleaned text available for LLM training.\n\nWhat it is useful for: building a custom pretraining corpus or studying web\ndata processing. It is a raw source, not a ready-made collection of good\nassistant answers. Extraction, language identification, filtering, and\ndeduplication determine which material reaches training. Two datasets can use\nCommon Crawl and still produce very different training data.\n\n1.2. FineWeb and FineWeb-Edu: broad coverage versus educational selection\n\nCreated by: Hugging Face’s FineWeb research team, including Guilherme Penedo, Hynek Kydlíček, Loubna Ben Allal, and collaborators. The team released both FineWeb and FineWeb-Edu. Research report.\n\nFineWeb was released as roughly 15 trillion English tokens, measured\nwith the GPT-2 tokenizer, from 96 Common Crawl snapshots. Its motivation is to\nprovide a large, reproducible web corpus with explicit cleaning and\ndeduplication. Its records are web documents, with text and provenance metadata.\nIt is useful as a general pretraining foundation or for comparing data filters.\nSee the FineWeb report.\n\nFineWeb-Edu asks a more selective question: which web pages contain useful\neducational material? The principal release contains about 1.3 trillion\ntokens, selected using educational-quality scoring; a less restrictive\nscore-2 variant contains about 5.4 trillion. It supports research into whether\na smaller, selected corpus teaches more per training token. It is filtered web\ntext, not a collection of synthetic tutor conversations. See the\nFineWeb-Edu card.\n\nBroad web data supplies many styles and topics, while educational selection\nfavors explanatory material. Selection also changes\ncoverage: “educational” is one objective, not a universal definition of quality.\n\n1.3. Dolma: an open training mixture\n\nCreated by: the Allen Institute for AI (Ai2), with Luca Soldaini and collaborators on the Dolma/OLMo project. Dolma paper.\n\nMotivation: support open language-model research, including OLMo, with a\ndocumented mixture rather than an opaque dataset. Dolma is a roughly 3 trillion\ntoken corpus containing web text, academic publications, code, books, and\nencyclopedic material. Releases and mixture recipes differ; a reported result\nis tied to a specific version. See the Dolma dataset card.\n\nUseful for: reproducing open pretraining experiments and testing how source\nbalance affects capabilities. A mixture makes the relative exposure to prose,\ncode, and other sources an explicit design decision.\nThe number of tokens in a corpus is distinct from how often a training recipe\nsamples each source.\n\n1.4. FineWeb2: multilingual web text\n\nCreated by: researchers at Hugging Face and EPFL, including Guilherme Penedo, Hynek Kydlíček, and collaborators. FineWeb2 paper.\n\nEnglish-heavy training data leaves other languages underrepresented. FineWeb2 was designed to adapt filtering and deduplication\nto over 1,000 languages, rather than apply English-specific rules everywhere.\nThe reported release has about 5 billion documents, 20 TB of text, and\nover 3 trillion words. Those are words, not a tokenizer-independent token\ncount. See the FineWeb2 card.\n\nUseful for: multilingual pretraining and studying language coverage. A large\nlanguage count does not imply equal data volume or quality in every language.\n\n1.5. The Stack v2: source code\n\nCreated by: BigCode, the open research collaboration led by Hugging Face and ServiceNow, working with Software Heritage on the source-code collection. Dataset card, BigCode governance.\n\nLearning to write code requires examples of source code as well as prose about\nprogramming.\nThe Stack v2 collects source code through Software Heritage across more than\n600 programming languages. The full release reports 67.5 TB of uncompressed\nsource content; deduplicated and training subsets are different datasets.\nIt includes code and repository/provenance information and underpins the\nStarCoder2 work. See the BigCode dataset card.\n\nMotivation and use: make large-scale code pretraining reproducible and study\ncode completion or code understanding. Raw files are not automatically\ninstruction/answer pairs. License metadata and source-code terms still matter;\ninclusion in a dataset is not blanket permission for every use.\n\n1.6. Older names that still appear in papers\n\nDatasetCreated byMotivation and contentsReported scale and useful contextC4Google Research’s T5 team, including Colin Raffel and collaboratorsA cleaned English Common Crawl corpus introduced with T5, providing consistent data for transfer-learning experimentsOriginal corpus roughly 750 GB of text; useful for understanding older pretraining recipes and baselines. Variants such as multilingual or unfiltered C4 have different sizes. T5 paper, C4 catalogThe PileEleutherAI, including Leo Gao, Stella Biderman, and collaboratorsBroaden training beyond generic web text using academic, professional, and other sources825 GiB, composed of 22 subsets; useful for studying source diversity and reproducing historical open-model work. It is a mixture, not a single uniformly licensed source. The Pile paper\n\nThese are important reference points, not an assertion that they are the best\nstarting point for a new project today.\n\n2. Instruction and conversation datasets\n\nLearning to continue documents does not by itself teach a model how to respond\nto user requests. Supervised fine-tuning (SFT) provides examples\nof desired responses, often as conversations:\n\n{\"messages\": [\n  {\"role\": \"user\", \"content\": \"Explain photosynthesis in one sentence.\"},\n  {\"role\": \"assistant\", \"content\": \"Plants use sunlight to turn water and carbon dioxide into sugars, releasing oxygen.\"}\n]}\n\nThe training recipe commonly applies loss to assistant responses. This teaches\nanswer format and task behavior. It does not replace the need for broad\npretraining knowledge.\n\n2.1. UltraChat 200k: synthetic conversations\n\nCreated by: the original UltraChat was developed by Ning Ding and collaborators in Tsinghua University’s THUNLP group. Hugging Face’s H4 team prepared the filtered ultrachat_200k derivative described here. Original project, H4 release.\n\nMotivation: provide a practical, filtered collection of synthetic\nconversations for instruction tuning. The Hugging Face H4 ultrachat_200k\nrelease has 207,865 examples in its SFT training split, with separate other\nsplits. It was used for Zephyr-7B-beta. The rows contain multi-turn messages,\ncovering questions, writing, and other assistant tasks. See the\nUltraChat 200k card.\n\nUseful for: learning an SFT pipeline or establishing a general conversational\nbaseline. The name does not describe every row across every split, and synthetic\nresponses should not be treated as independently verified facts.\n\n2.2. Tülu 3 SFT mixture: a broad instruction mixture\n\nCreated by: Ai2’s Tülu team and collaborators, combining existing community datasets with newly generated data. This credits the mixture’s curation; its individual sources have their own creators. Tülu 3 technical report.\n\nMotivation: make a strong, reproducible post-training recipe rather than\noptimize just one conversational skill. The mixture contains approximately\n939,000 prompt/response examples, combining public data with newly generated\nsynthetic examples. It covers areas such as general instruction following,\nreasoning, mathematics, coding, and safety. See the\nTülu 3 technical report and\nSFT dataset.\n\nUseful for: studying a broad post-training recipe and its component mixture.\nThe mixture lets researchers study how balancing task types affects the\nresulting model, rather than training on only one question style.\nA mixture can overlap with datasets distributed separately under other names.\n\n3. Preference datasets\n\nA model may produce several plausible answers that differ in accuracy,\nclarity, or relevance. A preference dataset compares alternatives for the same\nprompt:\n\n{\n  \"prompt\": \"Do plants get most of their carbon from soil?\",\n  \"chosen\": \"No. Most of their carbon comes from carbon dioxide absorbed from the air.\",\n  \"rejected\": \"Yes. Plants absorb most of their carbon through their roots from soil.\"\n}\n\nThis example labels factual correctness. Real preference labels can also encode\nhelpfulness, style, or other criteria; “chosen” does not mean objectively best\nunder every criterion.\n\n3.1. UltraFeedback: scalable feedback on candidate responses\n\nCreated by: Ganqu Cui, Lifan Yuan, Ning Ding, and collaborators, released through OpenBMB. Hugging Face’s H4 team produced the binarized derivative used here. Original project, H4 derivative.\n\nMotivation: produce feedback at scale using model-generated judgments.\nThe original UltraFeedback collection has about 64,000 prompts with multiple\ncandidate responses and feedback. The H4 binarized derivative converts these\ninto chosen/rejected pairs; its train_prefs split has about 61,000 rows.\nIt is a processed derivative, not another name for the entire original dataset.\nSee the UltraFeedback binarized card.\n\nUseful for: direct preference optimization (DPO), which trains a model to\nfavor chosen responses relative to rejected ones, or experiments with reward\nmodels. These are primarily AI judgments, not a survey of human preferences.\nJudge biases and label quality affect the behavior the model learns.\n\n4. Evaluation datasets\n\nTraining examples teach; held-out evaluation examples measure. If we train on\nthe questions and answers we later report as a test, we no longer have a clean\nmeasurement of generalization. Some datasets deliberately provide both training\nand test splits, but those roles must remain separate.\n\n4.1. Recognizable benchmarks and what they actually test\n\nDatasetCreated byWhy it exists and what is in itScaleUseful forMMLUDan Hendrycks, Collin Burns, Steven Basart, Andy Zou, Mantas Mazeika, Dawn Song, and Jacob Steinhardt. PaperTest breadth of academic and professional knowledge using multiple-choice questions across 57 subjectsRoughly 16,000 questions across its splitsBroad knowledge comparison; not a direct test of a multi-turn assistant or tool use. Author repositoryGSM8KOpenAI; Karl Cobbe and collaboratorsTest multi-step arithmetic reasoning using human-written grade-school word problems and worked solutionsRoughly 7,500 training and 1,000 test problemsTraining on the training split and evaluating arithmetic reasoning on held-out problems. Author repositoryHumanEvalOpenAI; Mark Chen and collaboratorsTest whether generated Python functions work, using prompts, reference solutions, and executable tests164 programming problemsA compact function-generation benchmark; not a test of navigating a large repository. Paper, evaluation harnessSWE-bench / VerifiedSWE-bench: Carlos E. Jimenez, John Yang, and collaborators at Princeton University and the University of Chicago. Verified: OpenAI in collaboration with the SWE-bench authors. Verified releaseMove from isolated functions to resolving real GitHub issues in repositories, evaluated through testsOriginal: 2,294 instances; Verified: 500 human-filtered instancesEvaluating a coding agent's model, tools, and execution workflow together. Report the subset and agent setup. Official benchmark\n\nThese established benchmarks explain many published scores, but should not be\nthe only evaluation for a new application. Public exposure and contamination can\nlimit their usefulness. A high score on short Python functions does not establish\nthat a model can resolve a real software issue across multiple files.\n\nApplication-specific evaluations measure behavior that broad public benchmarks\nmay not cover. Their value depends on representative tasks, explicit scoring\ncriteria, and separation from training data.\n\n5. Understanding dataset scale\n\nReported quantityWhat it tells usWhat it does not tell usTokensText volume under a particular tokenizerUnique knowledge, quality, or a directly comparable count under another tokenizerDocuments or filesNumber of recordsTheir lengths or whether near-duplicates remainConversationsNumber of dialogue examplesNumber of turns, supervised tokens, or correctnessPreference pairsNumber of comparisonsNumber of unique prompts or independent human judgmentsGB/TBStorage volume in a specified representationTraining tokens; compressed and unpacked sizes differ\n\nFor example, a hypothetical corpus of 100 billion unique tokens sampled twice\nproduces 200 billion training-token exposures. That does not mean the corpus\ncontains 200 billion unique tokens. Likewise, a million short conversations may\ncontain fewer tokens than a much smaller collection of long documents.\n\nReported scale depends on the dataset revision, subset, split, tokenizer,\nfiltering, and sampling weights. Derivatives and mixtures can overlap, so their\nheadline sizes cannot always be added together.\n\n6. How datasets differ beyond size\n\nOrigin: web documents, human-written examples, and model-generated examples\nhave different strengths and failure modes. Synthetic data can target specific\ntasks at scale, but inherits errors and biases from its generation and filtering.\n\nSelection: filtering and deduplication change which information is represented.\nFineWeb and FineWeb-Edu illustrate how a shared source can yield different\ncorpora with different objectives.\n\nComposition: a mixture's sampling weights affect what the model sees. A small\ncomponent sampled repeatedly can have more influence than its storage size suggests.\n\nProvenance and terms: public availability does not give every constituent\nsource identical permissions. Dataset cards document origins, processing, and\nusage conditions to varying degrees.\n\nEvaluation validity: benchmark scores describe performance on a particular\nset of tasks under a particular evaluation procedure. Overlap with training data,\npublic exposure, and differences in prompting or tools affect interpretation."])</script><script>self.__next_f.push([1,"15:T3cdc,"])</script><script>self.__next_f.push([1,"Docker\n\n1. Primer\n\nSuppose we have a small model that predicts y = weight * x + bias. We want to\npackage its code and parameters, send them to another machine, and serve\npredictions there without manually recreating the Python environment.\n\nWe will use a toy CPU model with fixed parameters and Flask for the HTTP endpoint.\nThere is no training step, GPU, or external model download. The example keeps the\npackaging visible; a larger inference service follows the same path.\n\n1.1. Start with a Dockerfile\n\nCreate a folder named tiny-inference with three files:\n\ntiny-inference/\n├── Dockerfile\n├── serve.py\n└── model.json\n\nThe Dockerfile tells Docker how to assemble the service:\n\n# Start with Python and its supporting Linux files.\nFROM python:3.13-slim\n\n# Set the working directory for the build and running program.\nWORKDIR /app\n\n# Install the HTTP framework before copying application files.\nRUN pip install --no-cache-dir \"Flask\u003e=3.1,\u003c4\"\n\n# Add the model parameters and serving code.\nCOPY model.json ./model.json\nCOPY serve.py ./serve.py\n\n# Document the application's port; this does not open a host port.\nEXPOSE 8000\n\n# Set the startup command; building the image does not run it.\nCMD [\"python\", \"serve.py\"]\n\nSee the Dockerfile overview.\n\n1.1.1. Give it something to serve\n\nIn model.json, store the model parameters:\n\n{\"weight\": 2.0, \"bias\": 1.0}\n\nIn serve.py, load them once and answer prediction requests:\n\nimport json\nimport math\nfrom pathlib import Path\nfrom flask import Flask, request\n\napp = Flask(__name__)\nmodel = json.loads(Path(\"model.json\").read_text())\n\n\n@app.get(\"/predict\")\ndef predict():\n    x = request.args.get(\"x\", type=float)\n    if x is None or not math.isfinite(x):\n        return {\"error\": \"Provide a finite numeric x\"}, 400\n    y = model[\"weight\"] * x + model[\"bias\"]\n    if not math.isfinite(y):\n        return {\"error\": \"Prediction is outside the supported range\"}, 400\n    return {\"x\": x, \"prediction\": y}\n\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\", port=8000)\n\nFor x=3, inference computes 2 * 3 + 1 = 7. Flask handles routing and turns\nthe returned dictionary into a JSON response. Its built-in server is used here\nfor the local demonstration. See the Flask quickstart.\n\n1.2. Build an image: the packaged service\n\nWith Docker installed and running, execute this from tiny-inference/:\n\ndocker build -t tiny-inference:1.0 .\n\nThe final . supplies the build context, the directory whose files the\nbuilder can use. The result is an image: an immutable package of filesystem\ncontent and runtime configuration. It contains Python, Flask, model.json, and\nserve.py, plus the instruction to run python serve.py.\n\nThe Dockerfile describes how to make the package. The image is the package that\nwas actually built. No inference server is running yet.\n\n1.2.1. Name the image: tag versus digest\n\nIn tiny-inference:1.0, tiny-inference is the repository name and 1.0 is a\ntag. A tag is a convenient label. Rebuilding with that same name can point\nit at a different image; the text 1.0 does not enforce immutability. Likewise,\nlatest is an ordinary tag, not a guarantee of the newest build.\n\nA digest, such as sha256:…, identifies specific content. When distributing\nan image, a reference such as repository@sha256:… pins a particular manifest\nor image index. Changing that object's bytes changes its digest. The local\nimage ID identifies the image configuration and is not interchangeable with\nthat registry reference. We will capture the registry digest after publishing.\n\nSee Docker image references and digest pulls.\n\n1.2.2. How Docker stores the image: layers\n\nDocker does not need to copy a complete Python installation for every service.\nThe image reuses the base image's layers, then adds our changes. A layer is a\nfilesystem changeset, not a full filesystem snapshot.\n\nflowchart BT\n    base[\"Base layers\u003cbr/\u003ePython and supporting files\"] --\u003e flask[\"Install Flask\"]\n    flask --\u003e model[\"Add /app/model.json\"]\n    model --\u003e code[\"Add /app/serve.py\"]\n    code --\u003e view[\"One visible filesystem\u003cbr/\u003ePython + Flask + model + server\"]\n\nThis diagram omits incidental filesystem changes such as creating /app.\nThe actual number of layers depends on the base and build. Configuration\ninstructions such as CMD do not need a filesystem layer.\n\nAn image manifest lists the layers in order and references a configuration\nobject holding defaults such as the command and working directory. Applying\nthe layers in order produces the files the program sees. See\nDocker image layers\nand the OCI manifest format.\n\n1.3. Publish the image to a registry\n\nThe image currently exists on our development machine. To let another machine\nretrieve it, publish it to a registry, a service that stores images. Docker\nHub and Amazon ECR are examples. A repository groups named image versions\ninside that registry.\n\nFor Docker Hub, replace YOUR_DOCKERHUB_USER below with your account name and\ncreate a tiny-inference repository in that account with your intended visibility:\n\ndocker login\ndocker tag tiny-inference:1.0 YOUR_DOCKERHUB_USER/tiny-inference:1.0\ndocker push YOUR_DOCKERHUB_USER/tiny-inference:1.0\n\ndocker tag gives the existing local image another reference; it does not\nrebuild or duplicate its contents. docker push uploads the content needed by\nthe registry and associates the tag with it. These are walkthrough commands;\nadding this note does not publish an image.\n\nAfter the push, inspect the remote reference:\n\ndocker buildx imagetools inspect YOUR_DOCKERHUB_USER/tiny-inference:1.0\n\nRecord its reported digest to deploy exactly that published version later.\nSee pushing images\nand inspecting registry images.\n\n1.3.1. What gets uploaded, and where compression fits\n\nLayers are represented as tar archives of filesystem changes. They are commonly\ncompressed individually before distribution. OCI supports uncompressed tar,\ngzip, and zstd layer formats; support for particular encodings depends on the\ntools involved. The registry stores these layer blobs along with image\nmetadata. See OCI layer media types.\n\nflowchart LR\n    layer[\"Layer changes\"] --\u003e archive[\"Tar archive\"]\n    archive --\u003e blob[\"Compressed blob\"]\n    blob --\u003e registry[\"Registry\"]\n\nOur JSON model is tiny. Imagine instead that its layer were 300 MB uncompressed\nand 90 MB compressed. Sending that missing blob would transfer roughly 90 MB,\nplus protocol overhead. These numbers are illustrative: model weights and\nalready-compressed files may compress much less effectively than repetitive text.\n\nCompression preserves the recovered files; it does not remove unwanted files\nor shrink the model's runtime memory requirements. Docker push progress can\nshow uncompressed sizes even though the transferred data is compressed.\nExisting blobs can be reused, so a push need not upload the entire image again.\nSee Docker push behavior.\n\n1.4. Pull it on the serving machine\n\nOn another Docker host, retrieve the package:\n\ndocker pull YOUR_DOCKERHUB_USER/tiny-inference:1.0\n\nAuthenticate there too if the repository is private. Docker retrieves the\nmetadata and missing layers, then prepares the filesystem for execution.\nFor a pinned deployment, replace the placeholder below with the full digest\nrecorded after publishing:\n\ndocker pull YOUR_DOCKERHUB_USER/tiny-inference@sha256:FULL_DIGEST\n\nA pull by tag resolves whatever that tag points to at that time; a digest\nreference selects the recorded content. See pulling images.\n\n1.4.1. The serving machine must support the image's platform\n\nFor the simplest walkthrough, use the same CPU architecture on both machines.\nAn image built for an ARM laptop is not automatically a native AMD64 image.\nA multi-platform image index can point to separate platform-specific manifests,\nletting Docker select the appropriate one. Building for other architectures may\nrequire emulation or suitable builders. See Docker multi-platform builds.\n\n1.5. Run a container and request a prediction\n\nOn the serving machine:\n\ndocker run --rm --name tiny-inference \\\n  -p 127.0.0.1:8000:8000 \\\n  YOUR_DOCKERHUB_USER/tiny-inference:1.0\n\nDocker creates a container, an instance of the image, and starts the recorded\ncommand. Python loads model.json and listens on port 8000 inside the container.\nFor a pinned deployment, use the same repository@sha256:FULL_DIGEST reference\nhere as in the pull command.\n\nThe -p mapping connects port 8000 on the host's loopback address to port 8000\nin the container. The application listens on 0.0.0.0 inside the container so\ntraffic reaching its network interface can reach the server. EXPOSE alone\nwould not create this mapping. See Docker run.\n\nIn another terminal on that serving machine:\n\ncurl 'http://127.0.0.1:8000/predict?x=3'\n\nExpected response:\n\n{\"x\": 3.0, \"prediction\": 7.0}\n\nThe image supplies the files and defaults; the running container executes the\ninference. Two containers can use the same immutable image layers while running\nseparate processes. The loopback mapping makes this a local demonstration;\nserving remote clients requires an appropriate host binding and network setup.\n\n1.5.1. What if the server writes a file?\n\nEach container has its own writable layer above the image. A new output file\ngoes there unless its destination is mounted elsewhere. With an overlay-style\nbackend, changing an image file copies it into the writable layer before\nmodification: copy-on-write. The original image remains unchanged.\n\nA stopped container normally retains this layer, but our --rm option removes\nthe container when it exits. For persistent prediction results, use a volume\nwhose lifetime is independent of the container, or a bind mount exposing a\nhost directory. See Docker storage.\n\n1.6. Change the model and publish version 1.1\n\nChange weight in model.json from 2.0 to 3.0, then build and publish a new\nversion:\n\ndocker build -t YOUR_DOCKERHUB_USER/tiny-inference:1.1 .\ndocker push YOUR_DOCKERHUB_USER/tiny-inference:1.1\n\nThe rebuilt service predicts 10 for x=3. Updating a tag or publishing version\n1.1 does not change an already-running container. Pull the new version and\nreplace the running container to serve the new model.\n\nDuring rebuilding, the build cache lets Docker reuse work whose instruction\nand inputs are unchanged. Our Python base can be reused; the changed model\ninvalidates its COPY step and following steps in that build sequence. The\nregistry may still reuse blobs whose content is unchanged.\n\nFor a larger inference service, install stable dependencies before copying\nfrequently edited code. Use .dockerignore to exclude local caches and unused\ncheckpoints from the build context. Cache reuse makes builds faster; it does\nnot by itself make the final image smaller. See Docker cache optimization.\n\n2. When the real model is large\n\n2.1. Deleting an earlier layer's file does not remove its bytes\n\nSuppose we package a model archive this way:\n\nCOPY model.tar /tmp/model.tar\nRUN mkdir /models \u0026\u0026 tar -xf /tmp/model.tar -C /models\nRUN rm /tmp/model.tar\n\nThe archive remains in the COPY layer, even though it is absent from the final\nvisible filesystem. Later layers hide earlier files; they do not rewrite them.\nDeletion uses special entries called whiteouts. Replacing a file generally\nstores the replacement, not a byte-level patch. See the OCI layer specification.\n\nA multi-stage build can keep the archive out of the final image:\n\nFROM python:3.13-slim AS unpack\nCOPY model.tar /tmp/model.tar\nRUN mkdir /out \u0026\u0026 tar -xf /tmp/model.tar -C /out\n\nFROM python:3.13-slim\nWORKDIR /app\nRUN pip install --no-cache-dir \"Flask\u003e=3.1,\u003c4\"\nCOPY --from=unpack /out/model.json ./model.json\nCOPY serve.py ./serve.py\nEXPOSE 8000\nCMD [\"python\", \"serve.py\"]\n\nAssume this example archive contains model.json at its root. The final stage\ncopies only the extracted model, rather than inheriting the unpack stage's\narchive layer. The intermediate stage may still occupy builder cache space.\nSee multi-stage builds.\n\n2.2. Registry size, local disk use, and RAM measure different things\n\nQuestionWhat to countHow much must a fresh machine download?Missing encoded blobs, often compressed, plus metadata and overheadHow much filesystem data is unpacked?Expanded layer contents, including content hidden by later layersHow much disk space does Docker consume?Shared blobs, filesystem snapshots, container writes, caches, and overheadHow much memory does inference require?Loaded model, runtime, and working data; measure the running service\n\nThe containerd image store retains compressed blobs and unpacked data. Images\ncan also share layers, so summing individual image sizes can double-count data.\nSee containerd disk usage.\n\nUse these commands to investigate an actual image or host:\n\ndocker image history --no-trunc tiny-inference:1.0\ndocker image inspect tiny-inference:1.0\ndocker system df -v\ndocker buildx du\n\nHistory helps locate large build contributions; it is not a complete filesystem\naudit. system df reports Docker storage accounting, while buildx du focuses\non builder cache.\n\n2.3. Transporting large images\n\nSuppose our inference image now includes large model weights and already lives\nin one registry. We want the same image in another registry, without changing\nits contents. Use crane copy to transfer the published image:\n\n# Install crane and authenticate to both registries before copying.\n# Replace these example references with your actual image locations.\nSOURCE_IMAGE='source.example.com/team/inference:1.0'\nTARGET_IMAGE='target.example.com/team/inference:1.0'\n\ncrane copy \"$SOURCE_IMAGE\" \"$TARGET_IMAGE\"\n\n# For an unchanged copy, these should report the same digest.\ncrane digest \"$SOURCE_IMAGE\"\ncrane digest \"$TARGET_IMAGE\"\n\ncrane works with registry images without requiring a Docker daemon. The copy\npreserves the image's digest rather than rebuilding it. By default it copies\nthe full image index for a multi-platform image; selecting one platform changes\nwhat is copied. See the crane copy documentation.\n\nWhy can this be faster than pulling, tagging, and pushing with Docker?\nCrane transfers the existing layer blobs in their stored form. For compressed\nlayers, it can carry the compressed bytes from source to destination without\nunpacking them into a local container filesystem or recompressing them. This\navoids CPU work and local disk I/O that a Docker image-store workflow may incur.\nSee crane's registry copy implementation.\n\nflowchart LR\n    source[\"Source registry\u003cbr/\u003eCompressed layer blobs\"] --\u003e crane[\"crane\u003cbr/\u003eTransfer existing blobs\"]\n    crane --\u003e target[\"Target registry\u003cbr/\u003eSame blob bytes and digests\"]\n\nFor example, if a layer is 10 GB unpacked but 4 GB compressed, the copy can\ntransfer the existing 4 GB blob without materializing the 10 GB filesystem.\nThese numbers are illustrative. The destination still needs any missing blobs,\nand data normally passes through the machine running crane; this is not a\nserver-side transfer between unrelated registries.\n\nThe benefit is avoiding unnecessary processing, not making the network faster.\nIf the destination's upload bandwidth is the bottleneck, transferring those\n4 GB still takes time. Nor does every Docker push recompress: the containerd\nimage store retains compressed blobs, so the performance difference depends on\nthe backend and cached content. See Docker image-store storage behavior.\n\nUse this when transporting an existing image unchanged. If the application or\nmodel changes, build a new image first, then copy that published result.\n\nRelated notes\n\nAWS networking: When this image lives in ECR, pulling its metadata and downloading its layers require the appropriate ECR and S3 network paths."])</script><script>self.__next_f.push([1,"c:[[\"children\",{\"s\":\"__PAGE__\",\"h\":512,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"div\",null,{\"className\":\"search-container\",\"children\":[[\"$\",\"p\",null,{\"className\":\"eyebrow\",\"children\":\"Find a connection\"}],[\"$\",\"h1\",null,{\"children\":\"Search the library\"}],[\"$\",\"p\",null,{\"className\":\"page-intro\",\"children\":\"Follow a topic, rediscover an idea, or find exactly what you need.\"}],[\"$\",\"$d\",null,{\"fallback\":[\"$\",\"p\",null,{\"children\":\"Loading search…\"}],\"children\":[\"$\",\"$Lf\",null,{\"notes\":[{\"file\":\"akashic/architecture.md\",\"url\":\"/akashic/architecture\",\"title\":\"Architecture\",\"description\":\"How Akashic turns Markdown files into a searchable, interactive library.\",\"tags\":[\"akashic\"],\"text\":\"$10\",\"hideTags\":false},{\"file\":\"akashic/getting-started.md\",\"url\":\"/akashic/getting-started\",\"title\":\"Getting started with Akashic\",\"description\":\"Set up, run, and write notes in Akashic.\",\"tags\":[\"akashic\"],\"text\":\"$11\",\"hideTags\":false},{\"file\":\"akashic/index.md\",\"url\":\"/akashic\",\"title\":\"Akashic\",\"description\":\"\",\"tags\":[\"akashic\"],\"text\":\"Akashic\\n\\nGuides to using and developing this knowledge library.\\n\\nGetting started: Local setup, writing notes, and building the app.Writing notes: Markdown conventions and rendering examples.Architecture: Content pipeline, rendering, app structure, and development.\",\"hideTags\":false},{\"fi
